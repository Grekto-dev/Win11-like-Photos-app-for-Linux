name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-pango-1.0 \
            python3-pil librsvg2-common xvfb fakeroot dpkg-dev desktop-file-utils
      - name: Tests
        run: |
          xvfb-run -a python3 tests/test_library.py
          xvfb-run -a python3 tests/test_i18n.py
          xvfb-run -a python3 tests/test_open_files.py
          xvfb-run -a python3 tests/test_editor_layout.py
      - name: Package builds
        run: scripts/build-deb.sh
